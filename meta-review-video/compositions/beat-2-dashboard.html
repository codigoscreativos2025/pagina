      .metric-icon.purple { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
      .metric-label {
        color: #94a3b8;
        font-size: 14px;
        font-weight: 500;
      }
      .metric-value {

        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 8px;
      }
      .metric-trend {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Sidebar slides in
      tl.from("#sidebar", {
        x: -300,
        duration: 0.4,
        ease: "power3.out"
      }, 0);
      
      // Nav items stagger
      tl.from("#nav1", { x: -20, opacity: 0, duration: 0.3 }, 0.5);
      tl.from("#nav2", { x: -20, opacity: 0, duration: 0.3 }, 0.6);
      tl.from("#nav3", { x: -20, opacity: 0, duration: 0.3 }, 0.7);
      tl.from("#nav4", { x: -20, opacity: 0, duration: 0.3 }, 0.8);
      tl.from("#nav5", { x: -20, opacity: 0, duration: 0.3 }, 0.9);
      
      // Header
      tl.from(".header", { y: -20, opacity: 0, duration: 0.3 }, 1.2);
      
      // Metrics stagger
      tl.from("#metric1", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.5);
      tl.from("#metric2", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.7);
      tl.from("#metric3", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.9);
      tl.from("#metric4", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 2.1);
      
      // Counter animations
      tl.add(() => {
        const counter1 = document.getElementById('counter1');
        const counter2 = document.getElementById('counter2');
        const counter3 = document.getElementById('counter3');
        const counter4 = document.getElementById('counter4');
        
        gsap.to(counter1, { innerHTML: 12, duration: 1.5, snap: { innerHTML: 1 }, ease: "power2.out" });
        gsap.to(counter2, { innerHTML: 2847, duration: 1.5, snap: { innerHTML: 1 }, ease: "power2.out" });
        gsap.to(counter3, { innerHTML: 156, duration: 1.5, snap: { innerHTML: 1 }, ease: "power2.out" });
        gsap.to(counter4, { innerHTML: 98, duration: 1.5, snap: { innerHTML: 1 }, ease: "power2.out", onComplete: () => {
          counter4.innerHTML = "98%";
        }});
      }, 2.5);
      
      window.__timelines["beat-2-dashboard"] = tl;
    </script>
