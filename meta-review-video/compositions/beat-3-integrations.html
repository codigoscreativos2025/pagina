<template id="beat-3-integrations-template">
  <div data-composition-id="beat-3-integrations" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="beat-3-integrations"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        display: flex;
        font-family: 'Inter', sans-serif;
      }
      .sidebar {
        width: 300px;
        height: 100%;
        background: #1e293b;
        border-right: 1px solid #334155;
        padding: 24px 0;
      }
      .sidebar-logo {
        padding: 0 24px 32px;
        font-size: 28px;
        font-weight: 700;
      }
      .logo-pivot { color: #60a5fa; }
      .logo-ai { color: #06b6d4; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        color: #94a3b8;
        font-size: 14px;
        font-weight: 500;
      }
      .nav-item.active {
        background: rgba(37, 99, 235, 0.1);
        color: #60a5fa;
        border-right: 3px solid #2563eb;
      }
      .main-content {
        flex: 1;
        padding: 32px;
      }
      .page-title {
        font-size: 28px;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 32px;
      }
      .integrations-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
      .integration-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .integration-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .integration-icon.facebook { background: #1877f2; }
      .integration-icon.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
      .integration-icon.whatsapp { background: #25d366; }
      .integration-icon.google { background: #fff; }
      .integration-info {
        flex: 1;
      }
      .integration-name {
        font-size: 18px;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 4px;
      }
      .integration-desc {
        font-size: 14px;
        color: #94a3b8;
      }
      .integration-status {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .integration-status.disconnected {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }
      .integration-status.connected {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
      }
      .btn-connect {
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .btn-connect.primary {
        background: #2563eb;
        color: #fff;
      }
      .btn-connect.primary:hover {
        background: #1d4ed8;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px;
        width: 480px;
        text-align: center;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 16px;
      }
      .modal-desc {
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .modal-btn {
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }
      .modal-btn.cancel {
        background: transparent;
        color: #94a3b8;
        border: 1px solid #475569;
      }
      .modal-btn.accept {
        background: #2563eb;
        color: #fff;
      }
      .check-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        display: none;
        margin: 0 auto 16px;
      }
      .check-icon.show {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cursor {
        width: 24px;
        height: 24px;
        position: absolute;
        z-index: 100;
      }
      @keyframes clickPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .clicking { animation: clickPulse 0.3s ease; }
    </style>
    
    <div class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-pivot">Pivot</span><span class="logo-ai">.AI</span>
      </div>
      <nav data-layout-allow-overflow>

        <div class="nav-item active">Integrations</div>
        <div class="nav-item">CRM</div>

    <div class="modal-overlay" id="modalOverlay">

          <svg viewBox="0 0 24 24" fill="currentColor" width="40"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>

        <p class="modal-desc" id="modalDesc">Pivot.AI wants to access your Facebook Ads account to display metrics and manage campaigns.</p>
        <div class="modal-actions">

        <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 01.35-.15h6.87a.5.5 0 00.35-.85L6.35 2.86a.5.5 0 00-.85.35z" fill="#fff" stroke="#000" stroke-width="1"/>
      </svg>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Page elements fade in
      tl.from(".page-title", { y: -20, opacity: 0, duration: 0.3 }, 0);
      
      // Integration cards stagger
      tl.from("#int1", { y: 20, opacity: 0, duration: 0.4 }, 0.3);
      tl.from("#int2", { y: 20, opacity: 0, duration: 0.4 }, 0.5);
      tl.from("#int3", { y: 20, opacity: 0, duration: 0.4 }, 0.7);
      tl.from("#int4", { y: 20, opacity: 0, duration: 0.4 }, 0.9);
      
      // Cursor enters
      tl.from("#cursor", { x: 200, opacity: 0, duration: 0.3 }, 1.5);
      
      // Cursor moves to Connect button
      tl.to("#cursor", { x: -420, y: -50, duration: 1.0, ease: "power2.inOut" }, 2.0);
      
      // Click
      tl.add(() => {
        document.getElementById('btnConnect1').classList.add('clicking');
      }, 3.2);
      
      // Modal appears
      tl.add(() => {
        document.getElementById('modalOverlay').classList.add('show');
      }, 3.5);
      
      tl.from("#modalOverlay", { opacity: 0, duration: 0.3 }, 3.5);
      tl.from(".modal", { scale: 0.9, opacity: 0, duration: 0.3, ease: "back.out" }, 3.6);
      
      // Cursor to Accept button
      tl.to("#cursor", { x: 0, y: 120, duration: 0.8, ease: "power2.inOut" }, 4.0);
      
      // Click Accept
      tl.add(() => {
        document.getElementById('btnAccept').classList.add('clicking');
      }, 5.0);
      
      // Success animation
      tl.add(() => {
        document.getElementById('modalTitle').textContent = 'Connected!';
        document.getElementById('modalDesc').textContent = 'Facebook Ads has been connected successfully.';
        document.getElementById('checkIcon').classList.add('show');
      }, 5.3);
      
      // Update card status
      tl.add(() => {
        document.getElementById('status1').textContent = 'Connected';
        document.getElementById('status1').classList.remove('disconnected');
        document.getElementById('status1').classList.add('connected');
      }, 6.0);
      
      // Hide modal
      tl.to("#modalOverlay", { opacity: 0, duration: 0.3 }, 6.5);
      
      window.__timelines["beat-3-integrations"] = tl;
    </script>
  </div>
</template>
