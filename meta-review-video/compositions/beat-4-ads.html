<template id="beat-4-ads-template">
  <div data-composition-id="beat-4-ads" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="beat-4-ads"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        display: flex;
        font-family: 'Inter', sans-serif;
      }
      .sidebar {
        width: 300px;
        height: 100%;
        background: #1e293b;
        border-right: 1px solid #334155;
        padding: 24px 0;
      }
      .sidebar-logo {
        padding: 0 24px 32px;
        font-size: 28px;
        font-weight: 700;
      }
      .logo-pivot { color: #60a5fa; }
      .logo-ai { color: #06b6d4; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        color: #94a3b8;
        font-size: 14px;
        font-weight: 500;
      }
      .nav-item.active {
        background: rgba(37, 99, 235, 0.1);
        color: #60a5fa;
        border-right: 3px solid #2563eb;
      }
      .main-content {
        flex: 1;
        padding: 24px 32px;
        overflow: auto;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        border-bottom: 1px solid #334155;
        padding-bottom: 12px;
      }
      .tab {
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab:hover { color: #f8fafc; }
      .tab.active {
        background: rgba(37, 99, 235, 0.2);
        color: #60a5fa;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 700;
        color: #f8fafc;
      }
      .metrics-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 32px;
      }
      .metric-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
      }
      .metric-label {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .metric-value {
        font-size: 28px;
        font-weight: 700;
        color: #f8fafc;
      }
      .metric-value.green { color: #22c55e; }
      .content-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .chart-section, .table-section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
      }
      .section-title {
        font-size: 16px;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 20px;
      }
      .chart {
        height: 200px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 0 10px;
      }
      .chart-bar {
        flex: 1;
        background: linear-gradient(180deg, #2563eb, #3b82f6);
        border-radius: 4px 4px 0 0;
        transition: height 0.5s ease;
      }
      .campaign-table {
        width: 100%;
        border-collapse: collapse;
      }
      .campaign-table th {
        text-align: left;
        padding: 12px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        border-bottom: 1px solid #334155;
      }
      .campaign-table td {
        padding: 12px;
        color: #f8fafc;
        font-size: 14px;
        border-bottom: 1px solid #334155;
      }
      .status-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
      }
      .status-badge.active {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
      }
      .status-badge.paused {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
    </style>
    
    <div class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-pivot">Pivot</span><span class="logo-ai">.AI</span>
      </div>
      <nav data-layout-allow-overflow>
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">Meta Ads</div>
        <div class="nav-item">Integrations</div>
        <div class="nav-item">CRM</div>
        <div class="nav-item">Settings</div>
      </nav>
    </div>
    
    <div class="main-content">
      <div class="tabs">
        <div class="tab active">Overview</div>
        <div class="tab">Campaigns</div>
        <div class="tab">Ad Sets</div>
        <div class="tab">Ads</div>
      </div>
      
      <div class="header">
        <h1 class="page-title">Meta Ads Performance</h1>
      </div>
      
      <div class="metrics-row">
        <div class="metric-card" id="metric1">
          <div class="metric-label">Total Spend</div>
          <div class="metric-value green" id="counter1">$0</div>
        </div>
        <div class="metric-card" id="metric2">
          <div class="metric-label">Impressions</div>
          <div class="metric-value" id="counter2">0</div>
        </div>
        <div class="metric-card" id="metric3">
          <div class="metric-label">Clicks</div>
          <div class="metric-value" id="counter3">0</div>
        </div>
        <div class="metric-card" id="metric4">
          <div class="metric-label">CTR</div>
          <div class="metric-value" id="counter4">0%</div>
        </div>
      </div>
      
      <div class="content-row">
        <div class="chart-section">
          <div class="section-title">Spend Over Time</div>
          <div class="chart" id="chart">
            <div class="chart-bar" style="height: 40%"></div>
            <div class="chart-bar" style="height: 60%"></div>
            <div class="chart-bar" style="height: 55%"></div>
            <div class="chart-bar" style="height: 75%"></div>
            <div class="chart-bar" style="height: 65%"></div>
            <div class="chart-bar" style="height: 85%"></div>
            <div class="chart-bar" style="height: 70%"></div>
            <div class="chart-bar" style="height: 90%"></div>
            <div class="chart-bar" style="height: 80%"></div>
            <div class="chart-bar" style="height: 95%"></div>
            <div class="chart-bar" style="height: 100%"></div>
            <div class="chart-bar" style="height: 88%"></div>
          </div>
        </div>
        
        <div class="table-section">
          <div class="section-title">Active Campaigns</div>
          <table class="campaign-table">
            <thead>
              <tr>
                <th>Campaign</th>
                <th>Status</th>
                <th>Spend</th>
                <th>Results</th>
                <th>CTR</th>
              </tr>
            </thead>
            <tbody>
              <tr id="row1">
                <td>Brand Awareness Q1</td>
                <td><span class="status-badge active">Active</span></td>
                <td>$4,250</td>
                <td>12,450</td>
                <td>2.8%</td>
              </tr>
              <tr id="row2">
                <td>Product Launch</td>
                <td><span class="status-badge active">Active</span></td>
                <td>$3,800</td>
                <td>8,200</td>
                <td>3.2%</td>
              </tr>
              <tr id="row3">
                <td>Retargeting</td>
                <td><span class="status-badge paused">Paused</span></td>
                <td>$2,400</td>
                <td>4,100</td>
                <td>4.1%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Page elements in
      tl.from(".tabs", { y: -20, opacity: 0, duration: 0.3 }, 0);
      tl.from(".page-title", { y: -20, opacity: 0, duration: 0.3 }, 0.2);
      
      // Metrics cards
      tl.from("#metric1", { y: 20, opacity: 0, duration: 0.4 }, 0.5);
      tl.from("#metric2", { y: 20, opacity: 0, duration: 0.4 }, 0.7);
      tl.from("#metric3", { y: 20, opacity: 0, duration: 0.4 }, 0.9);
      tl.from("#metric4", { y: 20, opacity: 0, duration: 0.4 }, 1.1);
      
      // Counter animations
      tl.add(() => {
        const counter1 = document.getElementById('counter1');
        const counter2 = document.getElementById('counter2');
        const counter3 = document.getElementById('counter3');
        const counter4 = document.getElementById('counter4');
        
        gsap.to(counter1, { 
          innerHTML: 12450, 
          duration: 1.5, 
          snap: { innerHTML: 1 }, 
          ease: "power2.out",
          onUpdate: function() { counter1.textContent = '$' + Math.round(this.targets()[0].innerHTML).toLocaleString(); }
        });
        gsap.to(counter2, { 
          innerHTML: 45200, 
          duration: 1.5, 
          snap: { innerHTML: 1 }, 
          ease: "power2.out" 
        });
        gsap.to(counter3, { 
          innerHTML: 1240, 
          duration: 1.5, 
          snap: { innerHTML: 1 }, 
          ease: "power2.out" 
        });
        gsap.to(counter4, { 
          innerHTML: 2.74, 
          duration: 1.5, 
          snap: { innerHTML: 0.01 }, 
          ease: "power2.out",
          onComplete: function() { counter4.textContent = '2.74%'; }
        });
      }, 1.5);
      
      // Chart bars animation
      tl.from(".chart-bar", { 
        scaleY: 0, 
        duration: 0.5, 
        stagger: 0.05, 
        ease: "power2.out" 
      }, 2.5);
      
      // Table rows
      tl.from("#row1", { x: -20, opacity: 0, duration: 0.3 }, 3.5);
      tl.from("#row2", { x: -20, opacity: 0, duration: 0.3 }, 3.7);
      tl.from("#row3", { x: -20, opacity: 0, duration: 0.3 }, 3.9);
      
      window.__timelines["beat-4-ads"] = tl;
    </script>
  </div>
</template>
